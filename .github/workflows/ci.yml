name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Transpile check
        run: |
          for f in extensions/worktree/*.ts; do
            bun build "$f" --no-bundle --external '*' --target=node --outfile="/tmp/$(basename "${f%.ts}").js"
          done

      - name: Tests
        run: bun test

      - name: Runtime smoke test
        run: bun run smoke
