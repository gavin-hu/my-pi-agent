name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every OS even if one fails, so a Windows-only regression is
      # visible without re-running the whole matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # oven-sh/bun#41024 (macOS) and #39709 (--isolate) remain open: a
      # --parallel worker can drop the subprocess exit notification for its
      # first spawn and park forever, so whichever git-heavy test runs first
      # burns its whole timeout and a different test does it on each run. The
      # macOS job runs the suite serially until that is fixed upstream; ubuntu
      # and windows keep --parallel=4.
      # The default shell per OS is intentional: forcing bash on Windows would
      # reintroduce Git-Bash path conversion, which is itself platform-specific.
      # format:check, typecheck, transpile, test, smoke
      - name: Run checks
        if: matrix.os != 'macos-latest'
        run: bun run check

      - name: Run checks (serial suite)
        if: matrix.os == 'macos-latest'
        run: bun run check:serial
