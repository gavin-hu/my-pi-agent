name: Bug report
description: Something in my-pi-agent is broken or behaves unexpectedly.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please reproduce against the newest release and
        fill in as much as you can.
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: The release tag or commit you are on.
      placeholder: v0.6.1
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      description: Shown in the header, or `pi --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: Extension
      description: Which extension is involved (`plan`, `worktree`, `bytefly`, ...), or "package" for install/load problems.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the exact output or error, and `/doctor` output if relevant.
    validations:
      required: true
  - type: input
    id: checks
    attributes:
      label: Local checks
      description: The result of `bun run check` if you are on a checkout.
      placeholder: passes / fails with ...
    validations:
      required: false
