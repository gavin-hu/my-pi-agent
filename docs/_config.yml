# The documentation site. GitHub Pages builds this folder from `main` /docs,
# so `baseurl` must stay the repository name: the project site lives under
# https://gavin-hu.github.io/my-pi-agent/, and every generated URL goes through
# `relative_url`.
title: my-pi-agent
# The home page's title tail, read against the brand, so it has to fit a search
# result where the description below does not.
tagline: A personal Pi coding-agent package
# What a page the navigation table does not list falls back to: the not-found page,
# and any share of it. A listed page's own summary in `_data/docs.json` is its
# description, so this one is not the site's description as such.
description: A Pi package of extensions, skills, and themes for working in a terminal.
url: "https://gavin-hu.github.io"
baseurl: "/my-pi-agent"

# The GoatCounter account the pageviews are counted on, as a bare host: the head builds the
# counting URL from it (`https://{{ site.goatcounter }}/count`), so an empty value would render
# `https:///count` on every page. `test/site-docs.test.ts` holds both facts.
goatcounter: gavin-hu.goatcounter.com

markdown: kramdown
permalink: pretty

# The one plugin: it rewrites a relative `.md` link to the page's real URL, so
# the Markdown stays readable on GitHub and still resolves on the site.
plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

# Every page wears the site's layout; a page body therefore carries no front
# matter and still renders cleanly in the repository.
defaults:
  - scope:
      path: ""
    values:
      layout: "page"
  - scope:
      path: "404.html"
    values:
      layout: "default"
  - scope:
      path: "search.json"
    values:
      layout: null
  # The extension, skill, and tutorial indexes are a directory's front door, not a
  # file named README.
  - scope:
      path: "extensions/README.md"
    values:
      permalink: "/extensions/"
  - scope:
      path: "skills/README.md"
    values:
      permalink: "/skills/"
  - scope:
      path: "tutorials/README.md"
    values:
      permalink: "/tutorials/"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
